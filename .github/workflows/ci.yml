name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -B tooling/ade.py regression
      - run: python -B tooling/ade.py static-policy
      - run: npm test
        working-directory: plugin
      - run: npx tsc -p tsconfig.json --noEmit
        working-directory: plugin
